services:
  app:
    build: .
    image: docker-board:ci
    environment:
      DB_HOST: db
      DB_NAME: board
      DB_USER: ci_board
      DB_PASSWORD: ci-only-password
    ports:
      - "127.0.0.1:18080:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: board
      MYSQL_USER: ci_board
      MYSQL_PASSWORD: ci-only-password
      MYSQL_ROOT_PASSWORD: ci-only-root-password
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u", "ci_board", "-pci-only-password", "board", "-e", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s
